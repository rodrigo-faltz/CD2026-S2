:root{
  --bg:#0B0E11; --ink:#E6EBEF; --ink2:#93A1AD; --mute:#5B6873; --rule:#1E262D;
  --cyan:#45C6DE; --green:#5BD48A; --amber:#F2B13A; --red:#F0524A; --lilac:#A98BF0;
}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;}
body{cursor:default;-webkit-user-select:none;user-select:none;}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;}
text{font-family:'Barlow',sans-serif;fill:var(--ink);font-variant-numeric:tabular-nums;}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.16em;}
.head{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;}
.num{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;}
.ink2{fill:var(--ink2);} .mute{fill:var(--mute);}
.cyan{fill:var(--cyan);} .green{fill:var(--green);} .amber{fill:var(--amber);} .red{fill:var(--red);}
.ln{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;}
.draw{stroke-dasharray:1;stroke-dashoffset:0;}
@keyframes flow{to{stroke-dashoffset:-28}}
.flow{animation:flow 1.4s linear infinite;}
</style>

<script>
// ---------------------------------------------------------------------------
// Motor da apresentação: palco SVG 1920x1080, uma timeline mestre pausada,
// cada clique termina num label. Avançar = tweenTo; voltar = tweenTo de 0,5 s;
// saltos = seek(label, false).
// ---------------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
const TOTAL = 14;                       // slides narrados (anexos não contam)
const C = {bg:'#0B0E11', ink:'#E6EBEF', ink2:'#93A1AD', mute:'#5B6873', rule:'#1E262D',
           cyan:'#45C6DE', green:'#5BD48A', amber:'#F2B13A', red:'#F0524A', lilac:'#A98BF0'};
const DECK = [];
function registerSlide(def){ DECK.push(def); }

// ---------- utilidades de desenho ----------
function el(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function fmt(v, dec){ return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:dec, maximumFractionDigits:dec}); }
// caminho que pode ser "desenhado" (pathLength=1, dasharray 1)
function drawable(e){ e.setAttribute('pathLength', '1'); e.classList.add('draw'); return e; }

// ---------- utilidades de animação (todas recebem a timeline e a posição) ----------
const A = {
  rise(tl, els, t, o={}){
    return tl.fromTo(els, {opacity:0, y:16}, {opacity:1, y:0, duration:o.d||.6, ease:'power2.out',
      stagger:o.s||0, immediateRender:true}, t);
  },
  fadeIn(tl, els, t, d=.5){ return tl.fromTo(els, {opacity:0}, {opacity:1, duration:d, ease:'power1.out', immediateRender:true}, t); },
  fadeOut(tl, els, t, d=.35){ return tl.to(els, {opacity:0, duration:d, ease:'power1.in'}, t); },
  dim(tl, els, t, to=.3, d=.5){ return tl.to(els, {opacity:to, duration:d, ease:'power1.inOut'}, t); },
  draw(tl, els, t, d=1, ease='power2.inOut', stagger=0){
    return tl.fromTo(els, {strokeDashoffset:1}, {strokeDashoffset:0, duration:d, ease, stagger, immediateRender:true}, t);
  },
  wipe(tl, rect, t, w, d=1.2, ease='power1.inOut'){
    return tl.fromTo(rect, {attr:{width:0}}, {attr:{width:w}, duration:d, ease, immediateRender:true}, t);
  },
  count(tl, textEl, from, to, dec, t, d=1, suffix=''){
    const o = {v:from};
    const set = () => { textEl.textContent = fmt(o.v, dec) + suffix; };
    set();
    return tl.fromTo(o, {v:from}, {v:to, duration:d, ease:'power2.out', onUpdate:set, immediateRender:true}, t);
  },
  // troca a legenda de baixo: some a anterior, entra a nova
  caption(tl, caps, k, t){
    if (k > 0 && caps[k-1]) tl.to(caps[k-1], {opacity:0, duration:.25, ease:'power1.in'}, t);
    tl.fromTo(caps[k], {opacity:0, y:10}, {opacity:1, y:0, duration:.5, ease:'power2.out', immediateRender:true}, t + (k>0 ? .2 : 0));
  },
};

// ---------- montagem ----------
const tl = gsap.timeline({paused:true});
const LABELS = [];                       // {name, slide}
let SLIDE_GROUPS = [];

function chromeFor(def, g){
  // rótulo do slide (topo, à esquerda), kicker e legendas (embaixo)
  const ch = el('g', {class:'chrome'}, g);
  const tag = def.annex ? (def.tag || 'ANEXO') : String(def.num).padStart(2, '0');
  el('text', {class:'mono', x:80, y:78, 'font-size':16}, ch, `${tag} · ${def.name}`);
  el('text', {class:'mono mute', x:80, y:1014, 'font-size':15}, ch, def.kicker || '');
  const caps = (def.captions || []).map(c => el('text', {x:80, y:1050, 'font-size':28, fill:'#C9D2DA', opacity:0}, ch, c));
  return {ch, caps};
}

function buildDeck(){
  const layer = document.getElementById('slides');
  const chromeLayer = el('g', {id:'chromeLayer'}, document.getElementById('frame'));
  const sweep = document.getElementById('sweep');
  tl.addLabel('start', 0);
  LABELS.push({name:'start', slide:-1});
  let prev = null;
  DECK.forEach((def, i) => {
    const g = el('g', {class:'slide', id:def.id}, layer);
    const content = el('g', {class:'content'}, g);
    const chromeG = el('g', {}, chromeLayer);
    const {ch, caps} = chromeFor(def, chromeG);
    const refs = def.mount(content) || {};
    refs.caps = caps;
    gsap.set([g, chromeG], {autoAlpha:0});
    SLIDE_GROUPS.push({g, chromeG, def});
    def.steps.forEach((step, k) => {
      let t = tl.duration();
      if (k === 0){
        // transição: varredura horizontal sutil
        if (prev){
          tl.to(prev.g, {autoAlpha:0, x:-70, duration:.5, ease:'power2.in'}, t);
          tl.to(prev.chromeG, {autoAlpha:0, duration:.3}, t);
          tl.fromTo(sweep, {attr:{x1:80, x2:80}}, {attr:{x1:1840, x2:1840}, duration:.7, ease:'power2.inOut', immediateRender:false}, t);
          tl.fromTo(sweep, {strokeOpacity:0}, {strokeOpacity:.35, duration:.2, immediateRender:false}, t);
          tl.fromTo(sweep, {strokeOpacity:.35}, {strokeOpacity:0, duration:.2, immediateRender:false}, t + .5);
          t += .35;
        }
        tl.fromTo(g, {autoAlpha:0, x:70}, {autoAlpha:1, x:0, duration:.6, ease:'power2.out', immediateRender:false}, t);
        tl.fromTo(chromeG, {autoAlpha:0}, {autoAlpha:1, duration:.4, immediateRender:false}, t);
        t += .15;
      }
      if (caps[k]) A.caption(tl, caps, k, t);
      step(tl, t, refs);
      const name = `${def.id}-${k+1}`;
      tl.addLabel(name, tl.duration());
      LABELS.push({name, slide:i});
    });
    prev = {g, chromeG};
  });
}

// ---------- navegação ----------
let cur = 0;          // índice do label alvo
let active = null;    // tween de navegação em andamento

function setCounter(i){
  const s = LABELS[i].slide;
  const c = document.getElementById('counter');
  if (s < 0){ c.textContent = ''; return; }
  const def = DECK[s];
  c.textContent = def.annex ? 'ANEXO' : `${String(def.num).padStart(2,'0')} / ${TOTAL}`;
}
function syncMedia(i){
  const s = LABELS[i].slide;
  SLIDE_GROUPS.forEach((sg, j) => sg.g.querySelectorAll('video').forEach(v => { if (j === s) v.play().catch(()=>{}); else v.pause(); }));
}
function finishActive(){
  if (active && active.isActive()){ active.kill(); tl.seek(LABELS[cur].name, false); }
  active = null;
}
function go(i, mode){
  i = Math.max(0, Math.min(LABELS.length - 1, i));
  finishActive();
  if (mode === 'jump' || (mode === 'fwd' && i !== cur + 1)){
    tl.seek(LABELS[i].name, false);
  } else if (mode === 'back'){
    active = tl.tweenTo(LABELS[i].name, {duration:.5, ease:'power1.inOut'});
  } else {
    active = tl.tweenTo(LABELS[i].name);
  }
  cur = i;
  setCounter(i); syncMedia(i);
  if (history.replaceState) history.replaceState(null, '', '#' + LABELS[i].name);
}

function matrix(g, x, y, title, labels, M, cs, unit){
  const mg = el('g', {}, g), n = labels.length, lw = 150;
  el('text', {class:'mono', x, y, 'font-size':15}, mg, title);
  el('text', {class:'mono mute', x, y:y + 22, 'font-size':13}, mg, unit);
  const tot = M.map(rw => rw.reduce((a, b) => a + b, 0));
  labels.forEach((l, j) => el('text', {class:'mono ink2', x:x + lw + j*cs + cs/2, y:y + 60, 'font-size':13, 'text-anchor':'middle'}, mg, l));
  M.forEach((rw, i) => {
    el('text', {class:'mono ink2', x:x + lw - 14, y:y + 74 + i*cs + cs/2 + 5, 'font-size':13, 'text-anchor':'end'}, mg, labels[i]);
    rw.forEach((v, j) => {
      const share = tot[i] ? v / tot[i] : 0, diag = i === j;
      el('rect', {x:x + lw + j*cs + 1, y:y + 74 + i*cs + 1, width:cs - 2, height:cs - 2,
        fill: diag ? C.green : C.amber, 'fill-opacity': v ? (.1 + .6*share).toFixed(3) : 0, stroke:C.rule, 'stroke-width':1}, mg);
      el('text', {class:'num', x:x + lw + j*cs + cs/2, y:y + 74 + i*cs + cs/2 + 9, 'font-size':24, 'text-anchor':'middle', fill: v ? C.ink : C.mute}, mg, fmt(v, 0));
    });
  });
  el('text', {class:'mono mute', x:x, y:y + 74 + n*cs + 30, 'font-size':12}, mg, 'LINHA: CLASSE REAL · COLUNA: PREDITA');
  return mg;
}
